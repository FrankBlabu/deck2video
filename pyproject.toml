[project]
name = "deck2video"
version = "0.1.0"
description = "Narrated talk videos from a slide deck: deterministic, text-in, video-out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "lxml>=5.2",
    "cssselect>=1.2",
    "httpx>=0.27",
    "playwright==1.63.0",
    "selectolax>=1.0.2",
]

[project.optional-dependencies]
# `local` voice: Piper (offline neural TTS) plus Whisper-based forced alignment
local = ["piper-tts>=1.3", "faster-whisper>=1.1"]
# `recorded` voice: your own recordings plus Whisper-based forced alignment
recorded = ["faster-whisper>=1.1"]

[project.scripts]
deck2video = "deck2video.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck2video"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
# E501: the formatter owns line length; RUF001-3: notes are typographic text.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cssselect.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: needs Chromium (Playwright)",
    "slow: integration tests that render and encode video",
    "live: calls the real ElevenLabs API (needs ELEVENLABS_API_KEY)",
]
addopts = "-m 'not live'"
